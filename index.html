<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE Case Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: calm engagement workbook, precise, coach-like
   IDEA: a consultant's case file: brief, client call notes, scratch work, then the build
   PICTURE: the live workspace itself (step rail + case file + Python bench)
   COLOUR and TYPE: white / ink / ultramarine; Spectral titles, Inter body, JetBrains Mono code
   LAYOUT: sticky header, step rail, two-column workbench that stacks under 980px */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d0e18);--ink:light-dark(#14110f,#e8e8f1);--mute:light-dark(#5f636e,#9ca1b3);
--acc:light-dark(#1d2bd8,#8e98ff);--accs:light-dark(#eef0ff,#1b1f45);--line:light-dark(#e2e4ea,#262a40);
--panel:light-dark(#f6f7f9,#141629);--ok:light-dark(#0f7a48,#4fd18f);--okb:light-dark(#e7f6ee,#10291e);
--bad:light-dark(#b3261e,#ff8a80);--badb:light-dark(#fdeceb,#2d1414);--warn:light-dark(#8a5a00,#f2c46d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Spectral,Georgia,serif;font-weight:600;line-height:1.1;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(28px,3.4vw,40px)}h2{font-size:26px}h3{font-size:19px}
p{margin:0 0 .8em}a{color:var(--acc)}
code,pre,textarea.code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13.5px}
pre{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin:0 0 12px;white-space:pre}
code{overflow-wrap:anywhere}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:10px max(3vw,14px);max-width:1440px;margin:0 auto}
.brand{font-family:Spectral,serif;font-weight:600;font-size:20px;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--ink);font:500 14px Inter,sans-serif;padding:8px 14px;border-radius:999px;min-height:38px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
:root[data-theme=dark] .seg button[aria-pressed=true]{color:#0d0e18}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .seg button[aria-pressed=true]{color:#0d0e18}}
.timer{font:600 20px "JetBrains Mono",monospace;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:8px;background:var(--accs);color:var(--acc);white-space:nowrap}
.timer.low{background:var(--badb);color:var(--bad)}
.chip{font-size:13px;color:var(--mute);white-space:nowrap}
.chip b{font-weight:600;color:var(--ink)}
main{max-width:1440px;margin:0 auto;padding:18px max(3vw,14px) 60px}
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;align-items:center}
.rail .part{font-size:13px;color:var(--mute);padding:0 6px;white-space:nowrap}
.rail button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 14px Inter,sans-serif;padding:9px 14px;border-radius:8px;min-height:42px;cursor:pointer;white-space:nowrap}
.rail button[aria-current=step]{border-color:var(--acc);background:var(--accs);color:var(--acc)}
.rail button:disabled{opacity:.45;cursor:not-allowed}
.rail button .n{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--panel);font-size:12px;line-height:20px;text-align:center;margin-right:6px}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--bg)}
.tools{position:sticky;top:76px}
@media(max-width:980px){.tools{position:static}}
.muted{color:var(--mute)}.small{font-size:14px}
.brief{border-left:3px solid var(--acc);padding:4px 0 4px 16px;margin:12px 0 16px;font-family:Spectral,serif;font-size:19px;line-height:1.45}
.who{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.av{width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--bg);display:grid;place-items:center;font-weight:600;flex:none}
button.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;font:600 15px Inter,sans-serif;padding:10px 16px;border-radius:8px;min-height:44px;cursor:pointer}
:root[data-theme=dark] button.btn{color:#0d0e18}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) button.btn{color:#0d0e18}}
button.ghost{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px Inter,sans-serif;padding:10px 14px;border-radius:8px;min-height:44px;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
textarea,input[type=text],input[type=number]{width:100%;font:16px/1.5 Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea.code{font-size:14px;line-height:1.5;tab-size:4;white-space:pre;overflow:auto;background:var(--panel)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:4px 2px 10px}
.msg{max-width:88%;padding:10px 14px;border-radius:12px;font-size:15px}
.msg.me{align-self:flex-end;background:var(--accs);color:var(--ink);border-bottom-right-radius:3px}
.msg.cl{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}
.meter{height:8px;border-radius:99px;background:var(--panel);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--acc)}
.fb{border-radius:8px;padding:10px 12px;margin:8px 0;font-size:15px}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.bad{background:var(--badb);color:var(--bad)}.fb.info{background:var(--accs);color:var(--ink)}
ul.check{list-style:none;padding:0;margin:8px 0}
ul.check li{padding:5px 0 5px 28px;position:relative;font-size:15px}
ul.check li::before{content:"";position:absolute;left:4px;top:11px;width:12px;height:12px;border-radius:3px;border:2px solid var(--mute)}
ul.check li.y::before{background:var(--ok);border-color:var(--ok)}
ul.check li.n::before{border-color:var(--bad)}
.ftabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ftabs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px "JetBrains Mono",monospace;padding:7px 10px;border-radius:6px;min-height:36px;cursor:pointer}
.ftabs button[aria-pressed=true]{border-color:var(--acc);color:var(--acc);background:var(--accs)}
.tbl{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font:13px "JetBrains Mono",monospace}
th,td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:pre}
th{position:sticky;top:0;background:var(--panel);font-weight:500}
.out{min-height:60px;max-height:260px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.5 "JetBrains Mono",monospace;white-space:pre-wrap;margin-top:8px}
.out.err{color:var(--bad)}
.count{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:520px){.count{grid-template-columns:minmax(0,1fr)}}
.test{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;font-size:15px}
.test.ok{border-color:var(--ok)}.test.bad{border-color:var(--bad)}
.tick{font-weight:600;margin-right:6px}.test.ok .tick{color:var(--ok)}.test.bad .tick{color:var(--bad)}
details{margin:8px 0}summary{cursor:pointer;font-weight:500;min-height:32px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font:600 clamp(26px,3vw,34px) Spectral,serif}
.stat span{font-size:13px;color:var(--mute)}
.pb{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.pb ol,.pb ul{padding-left:20px;margin:0}.pb li{margin:4px 0}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.case{border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.case[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.case b{font-family:Spectral,serif;font-size:18px;display:block}
.banner{background:var(--accs);border:1px solid var(--acc);border-radius:10px;padding:12px 16px;margin-bottom:14px}
.kbd{font:12px "JetBrains Mono",monospace;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
@media(max-width:600px){header{position:static}.tools{position:static}}
@media(prefers-reduced-motion:no-preference){.msg:nth-last-child(-n+2){animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>

</div></header>

5:15,PM\nE061,M05,2026-09-30 21:30,2026-10-01 04:00,ELEC\nE032,M04,2026-10-12 10:15,2026-10-12 14:15,CHG\nE036,M02,2026-10-22 05:00,2026-10-22 08:00,CHG\n", "machines.csv": "machine_id,name,line,decommissioned\nM01,Press 1,A,no\nM02,Press 2,A,no\nM03,Press 3,A,no\nM04,Press 4,A,no\nM05,Press 5,B,no\nM06,Press 6,B,no\nM07,Press 7,B,no\nM08,Press 8,B,yes\n"}}, "REF": {"A": "from datetime import datetime\n\ndef parse_date(s):\n    s = (s or \"\").strip()\n    if not s:\n        return None\n    for fmt in (\"%Y-%m-%d\", \"%m/%d/%Y\"):\n        try:\n            return datetime.strptime(s, fmt).date()\n        except ValueError:\n            pass\n    raise ValueError(f\"unknown date format: {s!r}\")\n\ndef on_time_by_carrier(shipments, carriers, start=\"2026-07-01\", end=\"2026-09-30\"):\n    names = {c[\"carrier_code\"].strip().upper(): c[\"carrier_name\"].strip() for c in carriers}\n    lo, hi = parse_date(start), parse_date(end)\n    seen, out = set(), {}\n    for r in shipments:\n        sid = r[\"shipment_id\"].strip()\n        if sid in seen:                      # scanner double-uploads\n            continue\n        seen.add(sid)\n        if r[\"status\"].strip().upper() == \"CANCELLED\":\n            continue\n        promised = parse_date(r[\"promised_date\"])\n        if not (lo <= promised <= hi):       # Q3 by promised date\n            continue\n        delivered = parse_date(r[\"delivered_date\"])\n        on_time = delivered is not None and delivered <= promised   # in transit = late\n        name = names[r[\"carrier_code\"].strip().upper()]\n        s = out.setdefault(name, {\"shipments\": 0, \"on_time\": 0})\n        s[\"shipments\"] += 1\n        s[\"on_time\"] += int(on_time)\n    for s in out.values():\n        s[\"pct\"] = round(100 * s[\"on_time\"] / s[\"shipments\"], 1)\n    return out\n", "B": "import re\n\ndef clean_amount(s):\n    return round(float(str(s).replace(\"$\", \"\").replace(\",\", \"\").strip()), 2)\n\ndef norm_invoice(s):\n    digits = re.sub(r\"\\D\", \"\", s or \"\")       # only the digits matter\n    return digits.lstrip(\"0\") or \"0\"\n\ndef find_duplicates(payments, vendors):\n    tax = {v[\"vendor_id\"].strip(): v[\"tax_id\"].strip() for v in vendors}\n    groups, credits = {}, {}\n    for p in payments:\n        t = tax[p[\"vendor_id\"].strip()]           # same company = same tax ID\n        inv = norm_invoice(p[\"invoice_no\"])\n        amt = clean_amount(p[\"amount\"])\n        if amt < 0:                                # credit memo = refund\n            credits[(t, inv)] = credits.get((t, inv), 0) - amt\n            continue\n        groups.setdefault((t, inv, amt), []).append(p[\"payment_id\"].strip())\n    out = []\n    for (t, inv, amt), ids in groups.items():\n        if len(ids) < 2:\n            continue\n        exposure = round(max(0.0, (len(ids) - 1) * amt - credits.get((t, inv), 0)), 2)\n        if exposure > 0:\n            out.append({\"tax_id\": t, \"invoice\": inv, \"amount\": amt,\n                        \"payment_ids\": sorted(ids), \"exposure\": exposure})\n    out.sort(key=lambda g: -g[\"exposure\"])\n    return out\n", "C": "import re\nfrom datetime import datetime\n\nPLANNED = {\"PM\", \"CHG\"}            # planned maintenance, changeover\n\ndef norm_machine(s):\n    return \"M%02d\" % int(re.sub(r\"\\D\", \"\", s))\n\ndef unplanned_hours(events, machines, month=\"2026-10\"):\n    y, m = map(int, month.split(\"-\"))\n    start = datetime(y, m, 1)\n    end = datetime(y + (m == 12), m % 12 + 1, 1)\n    info = {norm_machine(x[\"machine_id\"]): x for x in machines}\n    intervals = {}\n    for e in events:\n        if e[\"reason_code\"].strip().upper() in PLANNED:\n            continue\n        mid = norm_machine(e[\"machine_id\"])\n        mach = info.get(mid)\n        if mach is None or mach[\"decommissioned\"].strip().lower() in (\"yes\", \"y\", \"true\", \"1\"):\n            continue\n        s = datetime.strptime(e[\"start_ts\"].strip(), \"%Y-%m-%d %H:%M\" def _same(case, a, b):

def _grade(case, fn, user_src, ref_src, tests_json, folder):

    if fn not in user:

    res = []

function askClient(q){
  const t = ' ' + q.toLowerCase() + ' ';
  const scored = C().facts.map(f => ({f, s: f.k.reduce((a,k) => a + (t.includes(k) ? k.length : 0), 0)})).filter(x => x.s > 0).sort((a,b) => b.s - a.s);
  let ans;
  if(!scored.length){
    ans = /\?|^\s*(how|what|which|who|when|why|do|does|is|are|can|should)\b/i.test(q)
      ? "Hmm, I don't have a strong view on that. Use your judgment and tell me what you assumed."
      : "Sure. What do you need to know from me?";
  } else {
    const picks = [scored[0]];
    if(scored[1] && scored[1].s >= 4 && scored[1].f.id !== scored[0].f.id) picks.push(scored[1]);
    picks.forEach(p => { if(!S.asked.includes(p.f.id)) S.asked.push(p.f.id); });
    ans = picks.map(p => p.f.a).join(' Also: ');
  }
  S.chat.push({me:q}, {cl:ans});
}

      const T = GEN.TESTS[S.caseId][i];
      return `<div class="test ${r.ok?'ok':'bad'}"><span class="tick">${r.ok?'✓':'✗'}</span>${hidden ? 'Hidden check ' + (i+1) : esc(T.label)}
      ${!r.ok && !hidden ? `<div class="small muted" style="margin-top:4px">Client rule: ${esc(T.rule)}</div><details><summary class="small">Expected vs. got</summary><pre>${esc('expected: ' + r.exp + '\n\n     got: ' + (r.err || r.got))}</pre></details>` : ''}</div>`; }).join('');
  }
  return `<h2>Build: <code>${esc(c.fn)}()</code></h2>
  ${S.mode === 'drill' ? `<details open><summary>The agreed spec</summary><pre>${esc(c.spec)}</pre></details>` : '<p class="small muted">You build from your own plan. Function name and arguments are in the starter code.</p>'}
  <textarea class="code" rows="20" id="code" data-bind="code" spellcheck="false">${esc(S.code)}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn" data-act="runbuild">Run <span class="kbd">Ctrl+Enter</span></button><button class="btn" data-act="tests">Run checks</button><button class="ghost" data-act="resetcode">Reset code</button>${S.mode==='mock' ? '<button class="ghost" data-act="finish">Submit and review</button>' : '<button class="ghost" data-act="step" data-v="review">Review</button>'}</div>
  <div class="out ${S.buildErr?'err':''}" id="buildout">${esc(S.buildOut || 'Output appears here.')}</div>
  <div id="tests" style="margin-top:12px">${tests}</div>`;
}
function coachPanel(){
  const c = C();
  return `<h3>Coach</h3><p class="small muted">Hints get more specific each time. In the real test, ask the coach for the same kind of thing: a structure first, then a specific helper, and read every line it gives you.</p>
  ${c.hints.slice(0, S.hintsShown).map((h, i) => `<div class="fb info"><b>Hint ${i+1}.</b> ${i === 2 ? '<pre style="margin:6px 0 0">' + esc(h) + '</pre>' : esc(h)}</div>`).join('')}
  ${S.hintsShown < c.hints.length ? `<button class="ghost" data-act="hint">${S.hintsShown ? 'Another hint' : 'Ask the coach for a hint'}</button>` : ''}
  ${S.mode === 'drill' || S.finished ? `<details><summary>Reference solution</summary><pre>${esc(GEN.REF[S.caseId])}</pre></details>` : ''}`;
}
function buildSide(){
  const notes = S.chat.filter(m => m.cl).map(m => m.cl);
  return `<div class="card" style="margin-bottom:16px">${coachPanel()}</div>
  <div class="card" style="margin-bottom:16px"><h3>Your plan from Part 1</h3>${S.plan.trim() ? `<pre style="white-space:pre-wrap">${esc(S.plan)}</pre>` : '<p class="muted small">You didn\'t write a plan.</p>'}
  <details><summary>What the client told you (${notes.length})</summary><ul>${notes.map(n => `<li class="small">${esc(n)}</li>`).join('')}</ul></details></div>
  <div class="card">${filesBlock()}</div>`;
}
function filesBlock(){
  const files = GEN.FILES[S.caseId], name = files[S.file] ? S.file : Object.keys(files)[0];
  const lines = files[name].trim().split('\n'), rows = lines.map(l => parseLine(l));
  return `<h3>Files</h3><div class="ftabs">${Object.keys(files).map(n => `<button data-act="file" data-v="${esc(n)}" aria-pressed="${n===name}">${esc(n)}</button>`).join('')}</div>
  <div class="small muted" style="margin-bottom:6px">${lines.length - 1} rows. Spaces are shown as they are in the file; values are shown in quotes.</div>
  <div class="tbl"><table><thead><tr>${rows[0].map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(v => `<td>${v === '' ? '<span class="muted">·</span>' : '"' + esc(v) + '"'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function parseLine(l){ const out = []; let cur = '', q = false; for(let i = 0; i < l.length; i++){ const ch = l[i]; if(q){ if(ch === '"' && l[i+1] === '"'){ cur += '"'; i++; } else if(ch === '"') q = false; else cur += ch; } else if(ch === '"') q = true; else if(ch === ','){ out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; }
function toolsPanel(){
  return `<div class="card" style="margin-bottom:16px">${filesBlock()}</div>
  <div class="card"><h3>Assistant bench (Python)</h3><p class="small muted">Use it to read and count. Variables persist between runs. <span class="kbd">Ctrl+Enter</span> runs.</p>
  <textarea class="code" rows="9" id="scratch" data-bind="scratch" spellcheck="false">${esc(S.scratch)}</textarea>
  <div class="row" style="margin-top:8px"><button class="btn" data-act="runscratch">Run</button><button class="ghost" data-act="resetns">Reset variables</button></div>
  <div class="out ${S.scratchErr?'err':''}" id="scratchout">${esc(S.scratchOut || 'Output appears here.')}</div></div>`;
}
function summary(){
  const c = C(), crit = c.facts.filter(f => f.c), q = crit.filter(f => S.asked.includes(f.id)).length;
  const counts = GEN.COUNTS[S.caseId], cOk = counts.filter((x, i) => Number(S.counts[i]) === x.a).length;
  const pr = planRubric(S.plan), nr = noteRubric(S.note);
  const t = S.tests && S.tests.results ? S.tests.results.filter(r => r.ok).length : 0, tn = GEN.TESTS[S.caseId].length;
  return {q, qn: crit.length, cOk, cn: counts.length, p: pr.filter(r => r.ok).length, pn: pr.length, n: nr.filter(r => r.ok).length, nn: nr.length, t, tn, pr, nr, crit};
}
function stepReview(){
  const c = C(), s = summary();
  const used = S.p1Start ? fmtTime(((S.p2Start || Date.now()) - S.p1Start)/1000) + ' + ' + (S.p2Start ? fmtTime((Math.min(Date.now(), S.endAt || Date.now()) - S.p2Start)/1000) : '00:00') : null;
  return `<h1>${esc(c.title)}: review</h1>${used ? `<p class="muted">Time used: ${used} (Part 1 + Part 2)</p>` : ''}
  <div class="stats">
    <div class="stat"><b>${s.q}/${s.qn}</b><span>must-know topics asked</span></div>
    <div class="stat"><b>${s.cOk}/${s.cn}</b><span>counts correct</span></div>
    <div class="stat"><b>${s.p}/${s.pn}</b><span>plan coverage</span></div>
    <div class="stat"><b>${s.n}/${s.nn}</b><span>client note</span></div>
    <div class="stat"><b>${s.t}/${s.tn}</b><span>build checks passing</span></div>
  </div>
  <div class="grid"><section class="card">
    <h3>Questions: what you'd have learned by asking</h3><ul class="check">${s.crit.map(f => `<li class="${S.asked.includes(f.id)?'y':'n'}">${esc(f.a)}</li>`).join('')}</ul>
    <h3>Build checks</h3>${S.tests && S.tests.results ? S.tests.results.map((r, i) => `<div class="test ${r.ok?'ok':'bad'}"><span class="tick">${r.ok?'✓':'✗'}</span>${esc(GEN.TESTS[S.caseId][i].label)}${r.ok ? '' : `<div class="small muted">Client rule: ${esc(GEN.TESTS[S.caseId][i].rule)}</div>`}</div>`).join('') : '<p class="muted">No check run yet.</p>'}
    <h3>Counts</h3><ul class="check">${GEN.COUNTS[S.caseId].map((x, i) => `<li class="${Number(S.counts[i])===x.a?'y':'n'}">${esc(x.q)} <b>${x.a}</b>${S.counts[i] !== undefined && S.counts[i] !== '' && Number(S.counts[i]) !== x.a ? ' (you said ' + esc(S.counts[i]) + ')' : ''}</li>`).join('')}</ul>
  </section><section class="card">
    <h3>Plan</h3>${rubricList(s.pr)}<details><summary>Model plan</summary><pre>${esc(c.modelPlan)}</pre></details>
    <h3>Client note</h3>${rubricList(s.nr)}<details><summary>Model note</summary><pre style="white-space:pre-wrap">${esc(c.modelNote)}</pre></details>
    <details><summary>Reference solution</summary><pre>${esc(GEN.REF[S.caseId])}</pre></details>
    <div class="row" style="margin-top:14px"><button class="btn" data-act="again">Try this case again</button><button class="ghost" data-act="next">Next case</button></div>
  </section></div>`;
}
function playbook(){
  return `<h1>Playbook for the two-part client case</h1><p class="muted" style="max-width:70ch">This is a working method, not an official description of any company's test. The cases on the Case tab are built to reward exactly these habits: each one has traps that change the answer if you don't ask about them.</p>
  <div class="pb">
  <section class="card"><h3>Part 1: questions that always pay</h3><ol>
    <li><b>Goal:</b> what decision does this number feed? Is there a threshold (SLA, budget)?</li>
    <li><b>Definition:</b> what exactly counts as on time / a duplicate / downtime?</li>
    <li><b>Scope:</b> which period, and by which date? Which entities are in?</li>
    <li><b>Exclusions:</b> cancelled, planned, test, retired, refunded?</li>
    <li><b>Identity:</b> what makes two records the same thing? (IDs, spellings, double logging)</li>
    <li><b>Missing values:</b> what does a blank mean in their world?</li>
    <li><b>Output:</b> who reads it, in what shape, at what precision?</li>
    <li><b>Timing:</b> when is it needed, and is it one-off or recurring?</li></ol></section>
  <section class="card"><h3>Reading and counting with the assistant</h3><ul>
    <li>Ask for <b>exact counts</b> and the method behind them, not "roughly".</li>
    <li>Count <b>raw vs. distinct</b> on every key column. A gap means duplicates or messy spellings.</li>
    <li>Look at <b>distinct values</b> of every code or category column.</li>
    <li>Check <b>min and max</b> of every date. Rows outside the window are a question.</li>
    <li>Cross-check <b>one number a second way</b>. Assistants miscount.</li>
    <li>Every surprise becomes a client question, or an assumption you write down.</li></ul></section>
  <section class="card"><h3>Plan template (about 10 lines)</h3><pre>Goal:  the decision + any threshold
Inputs: files, row counts, keys
Steps:  clean → filter → identify → compute
Checks: totals reconcile, hand-trace 2–3 rows
Assumptions / open questions:
Output: shape, audience, precision</pre></section>
  <section class="card"><h3>Client note: five moves</h3><ol>
    <li>What they'll get, in their words.</li><li>When.</li><li>The rules you agreed, played back briefly.</li>
    <li>The one assumption you need confirmed.</li><li>No jargon: no "dedupe", "normalize" or "dataframe".</li></ol></section>
  <section class="card"><h3>Part 2: working with the coach</h3><ul>
    <li>Paste your plan's rules into the coach first, then ask for the <b>function skeleton only</b>.</li>
    <li>Ask for one helper at a time (date parser, ID normalizer). Test each one on a tricky value.</li>
    <li>Turn each client rule into a tiny test case. "Write 5 two-row inputs that test these rules."</li>
    <li>Run it on the real file and <b>reconcile against your Part 1 counts</b>.</li>
    <li>Read every line it writes. Ask "what does this do with a blank value?"</li>
    <li>Plain Python beats clever code. Leave 5 minutes for a final sanity pass and a one-line summary.</li></ul></section>
  <section class="card"><h3>The Palantir-style lens</h3><p>Commercial Palantir work is mostly this: messy exports from several systems, turned into trusted <b>objects</b> (Shipment, Vendor, Press) with clear keys, and <b>metrics</b> the business has agreed on. In every case, ask:</p><ul>
    <li>What is the object, and what is its real key?</li><li>Which source wins when two disagree?</li><li>Who owns the definition of the metric?</li><li>What would make this a pipeline that runs every month, and not a one-off script?</li></ul></section>
  </div>
  <h2 style="margin-top:26px">Pick a case</h2>${caseCards()}`;
}
function historyView(){
  const h = STORE.history;
  return `<h1>History</h1>${h.length ? `<div class="scroll"><table class="stack"><thead><tr><th>When</th><th>Case</th><th>Mode</th><th>Questions</th><th>Counts</th><th>Plan</th><th>Note</th><th>Checks</th></tr></thead><tbody>${h.slice().reverse().map(r => `<tr><td>${esc(r.when)}</td><td>${esc(r.case)}</td><td>${esc(r.mode)}</td><td>${esc(r.q)}</td><td>${esc(r.c)}</td><td>${esc(r.p)}</td><td>${esc(r.n)}</td><td>${esc(r.t)}</td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:12px"><button class="ghost" data-act="clearhist">Clear history</button></div>` : '<p class="muted">Finish a review and it shows up here, so you can see whether you\'re asking better questions over time. Stored in this browser only.</p>'}`;
}

/* ------------------------------------------------------------ timer */
function tick(){
  const el = document.getElementById('timer');
  if(S.mode !== 'mock' || !S.phase || S.phase === 3){ el.hidden = true; return; }
  const now = Date.now();
  const left = S.phase === 1 ? 900 - (now - S.p1Start)/1000 : 1800 - (now - S.p2Start)/1000;
  el.hidden = false; el.textContent = (S.phase === 1 ? 'Part 1 ' : 'Part 2 ') + fmtTime(left);
  el.classList.toggle('low', left < 120);
  if(left <= 0){ if(S.phase === 1) startP2(); else finish(); }
}
setInterval(() => { if(S.mode === 'mock' && (S.phase === 1 || S.phase === 2)) tick(); }, 1000);
function startP2(){ S.phase = 2; S.p2Start = Date.now(); S.step = 'build'; render(); }
async function finish(){
  if(S.phase === 3) return;
  S.phase = 3; S.finished = true; S.endAt = Date.now(); S.step = 'review'; render();
  if(S.testedCode !== S.code){ try{ S.tests = await grade(); S.testedCode = S.code; }catch(e){} }
  record(); render();
}
function record(){
  if(S.saved) return; S.saved = true;
  const s = summary();
  STORE.history.push({when: new Date().toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}), case: C().title, mode: S.mode,
    q: s.q + '/' + s.qn, c: s.cOk + '/' + s.cn, p: s.p + '/' + s.pn, n: s.n + '/' + s.nn, t: s.t + '/' + s.tn});
  if(STORE.history.length > 60) STORE.history = STORE.history.slice(-60);
}

/* ------------------------------------------------------------ events */
function newAttempt(caseId, mode){ STORE.cur = fresh(caseId, mode); S = STORE.cur; }
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if(!b || b.tagName === 'FORM') return;
  const a = b.dataset.act, v = b.dataset.v;
  if(a === 'view'){ S.view = v; location.hash = v === 'case' ? '' : v; render(); }
  else if(a === 'mode'){ if(v !== S.mode){ newAttempt(S.caseId, v); render(); } }
  else if(a === 'case'){ const view = S.view; if(v !== S.caseId || S.view !== 'case'){ if(v !== S.caseId) newAttempt(v, S.mode); S.view = 'case'; } render(); }
  else if(a === 'step'){ if(stepAllowed(v)){ S.step = v; if(v === 'review' && S.mode === 'drill' && !S.saved){ if(S.testedCode !== S.code){ try{ S.tests = await grade(); S.testedCode = S.code; }catch(err){} } record(); } render(); window.scrollTo({top:0}); } }
  else if(a === 'startmock'){ S.phase = 1; S.p1Start = Date.now(); S.step = 'brief'; render(); }
  else if(a === 'endp1'){ startP2(); }
  else if(a === 'finish'){ finish(); }
  else if(a === 'checkcounts'){ S.countChecked = true; render(); }
  else if(a === 'checkplan'){ S.planChecked = true; render(); }
  else if(a === 'checknote'){ S.noteChecked = true; render(); }
  else if(a === 'file'){ S.file = v; render(); }
  else if(a === 'hint'){ S.hintsShown++; render(); }
  else if(a === 'resetcode'){ S.code = C().starter; S.tests = null; render(); }
  else if(a === 'resetns'){ delete nsCache['scratch-' + S.caseId]; S.scratchOut = 'Variables cleared.'; S.scratchErr = false; render(); }
  else if(a === 'runscratch'){ await doRun('scratch'); }
  else if(a === 'runbuild'){ await doRun('build'); }
  else if(a === 'tests'){ const el = document.getElementById('tests'); el.innerHTML = '<p class="muted">Running checks…</p>';
    try{ S.tests = await grade(); S.testedCode = S.code; }catch(err){ S.tests = {error: String(err.message || err)}; } render(); }
  else if(a === 'again'){ newAttempt(S.caseId, S.mode); render(); }
  else if(a === 'next'){ const ids = Object.keys(CASES); newAttempt(ids[(ids.indexOf(S.caseId)+1) % ids.length], S.mode); render(); }
  else if(a === 'clearhist'){ STORE.history = []; render(); }
});
async function doRun(which){
  const outEl = document.getElementById(which === 'scratch' ? 'scratchout' : 'buildout');
  if(outEl){ outEl.classList.remove('err'); outEl.textContent = py ? 'Running…' : 'Loading Python (first run takes a few seconds)…'; }
  try{
    const r = which === 'scratch' ? await runIn(S.scratch, 'scratch-' + S.caseId, false) : await runIn(S.code, 'build', true);
    const text = r.out.trim() || '(no output; use print())';
    if(which === 'scratch'){ S.scratchOut = text; S.scratchErr = r.err; } else { S.buildOut = text; S.buildErr = r.err; }
    if(outEl){ outEl.textContent = text; outEl.classList.toggle('err', r.err); }
    save();
  }catch(err){ if(outEl){ outEl.textContent = 'Python could not load: ' + (err.message || err) + '\nCheck your connection and reload the page.'; outEl.classList.add('err'); } }
}
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-act=ask]'); if(!f) return; e.preventDefault();
  const inp = document.getElementById('q'), q = inp.value.trim(); if(!q) return;
  askClient(q); render(); const n = document.getElementById('q'); if(n) n.focus();
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.bind){ S[t.dataset.bind] = t.value; save(); }
  if(t.dataset.count !== undefined){ S.counts[t.dataset.count] = t.value; save(); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if(t.tagName === 'TEXTAREA' && t.classList.contains('code')){
    if(e.key === 'Tab' && !e.shiftKey){ e.preventDefault(); const s = t.selectionStart; t.setRangeText('    ', s, t.selectionEnd, 'end'); t.dispatchEvent(new Event('input', {bubbles:true})); }
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){ e.preventDefault(); doRun(t.id === 'scratch' ? 'scratch' : 'build'); }
  }
});
function fromHash(){ const h = location.hash.slice(1); if(h === 'playbook' || h === 'history') S.view = h; else if(h === '' && S.view !== 'case') {} }
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); S.view = (h === 'playbook' || h === 'history') ? h : 'case'; render(); });
fromHash();
if(S.mode === 'mock' && S.phase === 1 && (Date.now() - S.p1Start) / 1000 > 900) startP2();
render();
initPy().catch(() => {});
}
</script>
</body>
</html>
